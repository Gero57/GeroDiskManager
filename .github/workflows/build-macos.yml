name: Build Gero Disk Manager
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build universal app executable (Apple Silicon)
        run: |
          swift build -c release --triple arm64-apple-macosx13.0
      - name: Create application icon
        run: |
          swift Scripts/make-icon.swift
          mkdir GeroDiskManager.iconset
          sips -z 16 16 AppIcon.png --out GeroDiskManager.iconset/icon_16x16.png
          sips -z 32 32 AppIcon.png --out GeroDiskManager.iconset/icon_16x16@2x.png
          sips -z 32 32 AppIcon.png --out GeroDiskManager.iconset/icon_32x32.png
          sips -z 64 64 AppIcon.png --out GeroDiskManager.iconset/icon_32x32@2x.png
          sips -z 128 128 AppIcon.png --out GeroDiskManager.iconset/icon_128x128.png
          sips -z 256 256 AppIcon.png --out GeroDiskManager.iconset/icon_128x128@2x.png
          sips -z 256 256 AppIcon.png --out GeroDiskManager.iconset/icon_256x256.png
          sips -z 512 512 AppIcon.png --out GeroDiskManager.iconset/icon_256x256@2x.png
          sips -z 512 512 AppIcon.png --out GeroDiskManager.iconset/icon_512x512.png
          sips -z 1024 1024 AppIcon.png --out GeroDiskManager.iconset/icon_512x512@2x.png
          iconutil -c icns GeroDiskManager.iconset -o AppIcon.icns
      - name: Assemble macOS application
        run: |
          APP="Gero Disk Manager.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          BIN="$(swift build -c release --triple arm64-apple-macosx13.0 --show-bin-path)/GeroDiskManager"
          test -f "$BIN"
          cp "$BIN" "$APP/Contents/MacOS/GeroDiskManager"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Gero Disk Manager</string>
            <key>CFBundleDisplayName</key><string>Gero Disk Manager</string>
            <key>CFBundleIdentifier</key><string>it.gero.diskmanager</string>
            <key>CFBundleExecutable</key><string>GeroDiskManager</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          chmod +x "$APP/Contents/MacOS/GeroDiskManager"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Gero-Disk-Manager-macOS-arm64.zip"
      - name: Verify app bundle
        run: |
          test -d "Gero Disk Manager.app"
          test -x "Gero Disk Manager.app/Contents/MacOS/GeroDiskManager"
          plutil -lint "Gero Disk Manager.app/Contents/Info.plist"
          codesign --verify --deep --strict "Gero Disk Manager.app"
      - name: Upload installable app
        uses: actions/upload-artifact@v4
        with:
          name: Gero-Disk-Manager-macOS-arm64
          path: Gero-Disk-Manager-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 30
